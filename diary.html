<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダンス練習日記</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
  * {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  max-width: 700px;
  margin: 40px auto;
  padding: 0 20px;

  background: #eeeeff;
  color: #292938;
}


/* =========================
   上部ナビ
========================= */

.top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 40px;

  font-size: 14px;
  font-weight: 700;
}

.back-link,
.page-links a {
  text-decoration: none;
  color: #7775a8;
}

.back-link:hover,
.page-links a:hover {
  color: #555477;
}

.page-links {
  display: flex;
  gap: 24px;
}


/* =========================
   メインタイトル
========================= */

h1 {
  margin: 0 0 35px;

  color: #7775a8;

  font-size: 52px;
  font-weight: 900;

  letter-spacing: -4px;
  line-height: 1;
}


/* =========================
   小見出し
========================= */

h2 {
  margin-top: 35px;
  margin-bottom: 15px;

  color: #7775a8;

  font-size: 20px;
  font-weight: 900;

  border-bottom: 2px solid #c2c0e4;
  padding-bottom: 8px;
}


/* =========================
   アプリ本体
========================= */

#appArea {
  display: none;
}


/* =========================
   日付
========================= */

input[type="date"] {
  width: 100%;

  margin-top: 8px;
  padding: 13px;

  border: 2px solid #c2c0e4;
  border-radius: 7px;

  background: #ffffff;
  color: #555477;

  font-size: 15px;
  outline: none;
}


/* =========================
   日記入力
========================= */

textarea {
  width: 100%;
  height: 160px;

  margin-top: 12px;
  padding: 14px;

  border: 2px solid #c2c0e4;
  border-radius: 7px;

  background: #ffffff;
  color: #292938;

  font-family: inherit;
  font-size: 16px;

  resize: vertical;
  outline: none;
}

textarea:focus,
input[type="date"]:focus,
select:focus {
  border-color: #8d8bb9;
}


/* =========================
   ボタン
========================= */

button {
  margin-top: 12px;
  margin-right: 6px;

  padding: 11px 18px;

  border: 2px solid #aaa8d2;
  border-radius: 7px;

  background: #eeeeff;
  color: #555477;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;

  transition: 0.15s;
}

button:hover {
  background: #dcdcf5;
  color: #37364f;
}


/* =========================
   区切り線
========================= */

.section-divider {
  margin-top: 40px;
  margin-bottom: 30px;

  border: none;
  border-top: 2px solid #c2c0e4;
}


/* =========================
   週コピー
========================= */

.week-description {
  margin-bottom: 8px;

  color: #777691;

  font-size: 14px;
}

#weekSelect {
  padding: 10px;

  border: 2px solid #c2c0e4;
  border-radius: 7px;

  background: #ffffff;
  color: #555477;

  font-size: 15px;

  outline: none;
}

#copyMessage {
  margin-top: 10px;

  color: #7775a8;
  font-weight: 700;
}


/* =========================
   過去の日記
========================= */

.diary {
  margin-top: 14px;
  padding: 18px;

  border: 2px solid #c2c0e4;
  border-radius: 10px;

  background: #f7f7ff;
}

.diary strong {
  color: #7775a8;

  font-size: 16px;
}

.diary-text {
  white-space: pre-wrap;

  margin: 14px 0;

  line-height: 1.7;
}


/* 過去日記の編集・削除は少し小さく */

.diary button {
  padding: 7px 12px;

  font-size: 12px;

  border-width: 1px;
}


/* 削除ボタンはさらに控えめ */

.diary button:last-child {
  color: #9998b5;

  border-color: #d2d1e5;

  background: transparent;
}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  body {
    margin: 25px auto;
    padding: 0 16px;
  }

  .top-nav {
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 30px;
  }

  .page-links {
    width: 100%;
    gap: 18px;
    flex-wrap: wrap;
  }

  h1 {
    font-size: 42px;
    letter-spacing: -3px;
    margin-bottom: 28px;
  }

  /* 日付と日記入力欄の横幅を揃える */
  input[type="date"],
  textarea {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
  }

  textarea {
    height: 150px;
  }

  #weekSelect {
    width: 100%;
    margin-bottom: 4px;
  }

  #weekSelect + button {
    width: 100%;
  }

}
</style>
</head>

<body>

  <div class="top-nav">

  <a class="back-link" href="index.html">
    ← 管理画面
  </a>

  <div class="page-links">

    <a href="vision.html">
      なりたい像
    </a>

    <a href="diary.html">
      日記
    </a>

    <a href="move.html">
      ムーブ管理
    </a>

  </div>

</div>

  <div id="appArea">

    <h1>ダンス練習日記</h1>

    <input type="date" id="date">

    <textarea
      id="diaryText"
      placeholder="今日の練習について書く"
    ></textarea>

    <br>

    <button onclick="saveDiary()">
      保存
    </button>

    <button
      id="cancelEditButton"
      onclick="clearForm()"
      style="display:none;"
    >
      編集をキャンセル
    </button>

    <hr class="section-divider">

<h2>週ごとにコピー</h2>

<p class="week-description">
  コピーしたい週の月曜日を選択
</p>

<select id="weekSelect"></select>

<button onclick="copyWeekDiaries()">
  この週の日記をコピー
</button>

<p id="copyMessage"></p>

    <h2>過去の日記</h2>

    <div id="diaryList"></div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://ujjnommuwuziebqlpoow.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_NkUf6eUb459UuuGDCMzJrQ_ILcc7PJf";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let currentUser = null;
    let diaries = [];
    let editingId = null;


    // =========================
    // 初期処理
    // =========================

    async function initialize() {

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        console.error(error);
        return;
      }

      // 未ログインなら管理画面へ戻す
      if (!data.session) {
        window.location.href = "index.html";
        return;
      }

      currentUser = data.session.user;

      document.getElementById("appArea").style.display =
        "block";

      await loadDiaries();
    }


    // =========================
    // 日記取得
    // =========================

    async function loadDiaries() {

      const { data, error } =
        await supabaseClient
          .from("diaries")
          .select("*")
          .order("diary_date", {
            ascending: false
          })
          .order("created_at", {
            ascending: false
          });

      if (error) {
        alert(
          "日記の読み込みに失敗しました：" +
          error.message
        );
        return;
      }

      diaries = data;

      showDiaries();
      generateWeeks();
    }


    // =========================
    // 保存・更新
    // =========================

    async function saveDiary() {

      const date =
        document.getElementById("date").value;

      const text =
        document
          .getElementById("diaryText")
          .value
          .trim();

      if (!date || !text) {
        alert("日付と日記を入力してください");
        return;
      }


      let error;


      // 新規保存
      if (editingId === null) {

        const result =
          await supabaseClient
            .from("diaries")
            .insert({
              user_id: currentUser.id,
              diary_date: date,
              text: text
            });

        error = result.error;

      }

      // 編集保存
      else {

        const result =
          await supabaseClient
            .from("diaries")
            .update({
              diary_date: date,
              text: text
            })
            .eq("id", editingId);

        error = result.error;

      }


      if (error) {

        alert(
          "保存に失敗しました：" +
          error.message
        );

        return;
      }


      clearForm();

      await loadDiaries();
    }


    // =========================
    // 編集
    // =========================

    function editDiary(id) {

      const diary =
        diaries.find(
          diary => diary.id === id
        );

      if (!diary) {
        return;
      }

      document.getElementById("date").value =
        diary.diary_date;

      document.getElementById("diaryText").value =
        diary.text;

      editingId = diary.id;

      document
        .getElementById("cancelEditButton")
        .style.display = "inline-block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    function clearForm() {

      document.getElementById("date").value = "";

      document.getElementById("diaryText").value = "";

      editingId = null;

      document
        .getElementById("cancelEditButton")
        .style.display = "none";
    }


    // =========================
    // 削除
    // =========================

    async function deleteDiary(id) {

      const ok =
        confirm("この日記を削除しますか？");

      if (!ok) {
        return;
      }

      const { error } =
        await supabaseClient
          .from("diaries")
          .delete()
          .eq("id", id);

      if (error) {

        alert(
          "削除に失敗しました：" +
          error.message
        );

        return;
      }

      if (editingId === id) {
        clearForm();
      }

      await loadDiaries();
    }


    // =========================
    // 表示
    // =========================

    function showDiaries() {

      const diaryList =
        document.getElementById("diaryList");

      diaryList.innerHTML = "";

      if (diaries.length === 0) {

        diaryList.innerHTML =
          "<p>まだ日記がありません。</p>";

        return;
      }


      diaries.forEach(diary => {

        diaryList.innerHTML += `
          <div class="diary">

            <strong>
              ${escapeHtml(diary.diary_date)}
            </strong>

            <p class="diary-text">${escapeHtml(diary.text)}</p>

            <button onclick="editDiary(${diary.id})">
              編集
            </button>

            <button onclick="deleteDiary(${diary.id})">
              削除
            </button>

          </div>
        `;

      });
    }

    // =========================
// 週一覧を作成
// =========================

function generateWeeks() {

  const weekSelect =
    document.getElementById("weekSelect");

  weekSelect.innerHTML = "";

  // 日記が1件もない場合
  if (diaries.length === 0) {

    const option =
      document.createElement("option");

    option.textContent =
      "日記がありません";

    option.disabled = true;

    weekSelect.appendChild(option);

    return;
  }


  // 今日
  const today = new Date();

  today.setHours(0, 0, 0, 0);


  // 今日を含む週の月曜日を取得
  const currentMonday =
    getMonday(today);


  // 一番古い日記の日付
  const oldestDiary =
    diaries[diaries.length - 1];

  const oldestDate =
    parseDate(oldestDiary.diary_date);


  // 一番古い日記が属する週の月曜日
  const oldestMonday =
    getMonday(oldestDate);


  // 今週から過去へ1週間ずつ遡る
  const monday =
    new Date(currentMonday);

  while (monday >= oldestMonday) {

    const dateString =
      formatDate(monday);

    const option =
      document.createElement("option");

    option.value = dateString;
    option.textContent = dateString;

    weekSelect.appendChild(option);

    monday.setDate(
      monday.getDate() - 7
    );
  }
}


// =========================
// 選択した週の日記をコピー
// =========================

async function copyWeekDiaries() {

  const selectedMonday =
    document
      .getElementById("weekSelect")
      .value;

  if (!selectedMonday) {
    alert("週を選択してください");
    return;
  }


  // 月曜日
  const monday =
    parseDate(selectedMonday);


  // 日曜日
  const sunday =
    new Date(monday);

  sunday.setDate(
    sunday.getDate() + 6
  );


  // 選択した週の日記だけ取り出す
  const weekDiaries =
    diaries
      .filter(diary => {

        const diaryDate =
          parseDate(diary.diary_date);

        return (
          diaryDate >= monday &&
          diaryDate <= sunday
        );

      })
      .sort((a, b) =>
        a.diary_date.localeCompare(
          b.diary_date
        )
      );


  if (weekDiaries.length === 0) {

    alert(
      "この週の日記はありません"
    );

    return;
  }


  // コピーする文章を作成
  let copyText = "";

  weekDiaries.forEach(diary => {

    copyText +=
      `${diary.diary_date}\n`;

    copyText +=
      `${diary.text}\n\n`;

  });


  // クリップボードへコピー
  try {

    await navigator.clipboard.writeText(
      copyText.trim()
    );

    document
      .getElementById("copyMessage")
      .textContent =
      "コピーしました！";

  } catch (error) {

    console.error(error);

    alert(
      "コピーに失敗しました"
    );

  }
}


// =========================
// 日付関連
// =========================

// 指定した日が属する週の月曜日を取得
function getMonday(date) {

  const result =
    new Date(date);

  const day =
    result.getDay();

  // 日曜なら6日前、
  // その他なら曜日に応じて戻す
  const diff =
    day === 0
      ? -6
      : 1 - day;

  result.setDate(
    result.getDate() + diff
  );

  result.setHours(
    0, 0, 0, 0
  );

  return result;
}


// "2026-09-14" → Date
function parseDate(dateString) {

  const [
    year,
    month,
    day
  ] =
    dateString
      .split("-")
      .map(Number);

  return new Date(
    year,
    month - 1,
    day
  );
}


// Date → "2026-09-14"
function formatDate(date) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    initialize();

  </script>

</body>

</html>
