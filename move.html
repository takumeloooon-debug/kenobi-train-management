<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ムーブ管理</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
  * {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  max-width: 700px;
  margin: 40px auto;
  padding: 0 20px;

  background: #eeeeff;
  color: #292938;
}


/* =========================
   上部ナビ
========================= */

.top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 40px;

  font-size: 14px;
  font-weight: 700;
}

.back-link,
.page-links a {
  text-decoration: none;
  color: #7775a8;
}

.back-link:hover,
.page-links a:hover {
  color: #555477;
}

.page-links {
  display: flex;
  gap: 24px;
}


/* =========================
   メインタイトル
========================= */

h1 {
  margin: 0 0 35px;

  color: #7775a8;

  font-size: 52px;
  font-weight: 900;

  letter-spacing: -4px;
  line-height: 1;
}


/* =========================
   小見出し
========================= */

h2 {
  margin-top: 40px;
  margin-bottom: 15px;

  color: #7775a8;

  font-size: 20px;
  font-weight: 900;

  border-bottom: 2px solid #c2c0e4;
  padding-bottom: 8px;
}

h3 {
  margin-top: 20px;
  margin-bottom: 8px;

  color: #555477;

  font-size: 16px;
  font-weight: 800;
}


/* =========================
   アプリ本体
========================= */

#appArea {
  display: none;
  width: 100%;
  min-width: 0;
}


/* =========================
   ネタ入力
========================= */

#moveIdea {
  display: block;

  width: 100%;
  max-width: 100%;
  min-width: 0;

  padding: 13px;

  border: 2px solid #c2c0e4;
  border-radius: 7px;

  background: #ffffff;
  color: #292938;

  font-family: inherit;
  font-size: 16px;

  outline: none;
}


/* =========================
   詳細入力
========================= */

textarea {
  display: block;

  width: 100%;
  max-width: 100%;
  min-width: 0;

  height: 160px;

  margin-top: 8px;
  padding: 14px;

  border: 2px solid #c2c0e4;
  border-radius: 7px;

  background: #ffffff;
  color: #292938;

  font-family: inherit;
  font-size: 16px;
  line-height: 1.6;

  resize: vertical;
  outline: none;
}

#moveIdea:focus,
textarea:focus {
  border-color: #8d8bb9;
}


/* =========================
   ボタン
========================= */

button {
  margin-top: 12px;
  margin-right: 6px;

  padding: 11px 18px;

  border: 2px solid #aaa8d2;
  border-radius: 7px;

  background: #eeeeff;
  color: #555477;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;

  transition: 0.15s;
}

button:hover {
  background: #dcdcf5;
  color: #37364f;
}


/* =========================
   編集キャンセル
========================= */

#cancelEditButton {
  color: #9998b5;
  border-color: #d2d1e5;
  background: transparent;
}


/* =========================
   ムーブ一覧
========================= */

.move {
  margin-top: 14px;
  padding: 18px;

  border: 2px solid #c2c0e4;
  border-radius: 10px;

  background: #f7f7ff;
}

.move h3 {
  margin-top: 0;
  margin-bottom: 16px;

  color: #7775a8;

  font-size: 17px;
  font-weight: 900;
}

.move p {
  margin: 10px 0;

  line-height: 1.7;

  overflow-wrap: break-word;
}

.move-label {
  color: #555477;
}


/* 一覧内の編集・削除ボタン */

.move button {
  padding: 7px 12px;

  font-size: 12px;

  border-width: 1px;
}


/* 削除は少し控えめ */

.move button:last-child {
  color: #9998b5;

  border-color: #d2d1e5;

  background: transparent;
}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  body {
    margin: 25px auto;
    padding: 0 16px;
  }

  .top-nav {
    flex-direction: column;
    align-items: flex-start;

    gap: 14px;

    margin-bottom: 30px;
  }

  .page-links {
    width: 100%;

    gap: 18px;

    flex-wrap: wrap;
  }

  h1 {
    font-size: 42px;

    letter-spacing: -3px;

    margin-bottom: 28px;
  }

  #moveIdea,
  textarea {
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  textarea {
    height: 150px;
  }

  .move {
    padding: 16px;
  }
}
</style>

</head>


<body>

  <!-- =========================
       管理画面に戻る
  ========================== -->

  <div class="top-nav">

  <a class="back-link" href="index.html">
    ← 管理画面
  </a>

  <div class="page-links">

    <a href="vision.html">
      なりたい像
    </a>

    <a href="diary.html">
      日記
    </a>

    <a href="move.html">
      ムーブ管理
    </a>

  </div>

</div>


  <!-- =========================
       ムーブ管理画面
  ========================== -->

  <div id="appArea">

    <h1>ムーブ管理</h1>


    <!-- ネタ -->

    <h3>ネタ</h3>

    <input
      type="text"
      id="moveIdea"
      placeholder="ムーブのネタを入力"
    >


    <!-- 詳細 -->

    <h3>詳細</h3>

    <textarea
      id="moveDetail"
      placeholder="ムーブの詳細を入力"
    ></textarea>


    <br>


    <!-- 保存 -->

    <button onclick="saveMove()">
      保存
    </button>


    <!-- 編集キャンセル -->

    <button
      id="cancelEditButton"
      onclick="clearForm()"
      style="display:none;"
    >
      編集をキャンセル
    </button>


    <!-- ムーブ一覧 -->

    <h2>ムーブ一覧</h2>

    <div id="moveList"></div>

  </div>


  <script>

    // ========================================
    // Supabase接続設定
    // ========================================

    const SUPABASE_URL =
      "https://ujjnommuwuziebqlpoow.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_NkUf6eUb459UuuGDCMzJrQ_ILcc7PJf";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ========================================
    // 変数
    // ========================================

    let currentUser = null;

    let moves = [];

    let editingId = null;



    // ========================================
    // ページを開いたとき
    // ========================================

    async function initialize() {

      const { data, error } =
        await supabaseClient.auth.getSession();


      if (error) {

        console.error(error);

        return;
      }


      // ログインしていなければ
      // 管理画面へ戻す

      if (!data.session) {

        window.location.href =
          "index.html";

        return;
      }


      // ログインユーザーを保存

      currentUser =
        data.session.user;


      // 画面を表示

      document
        .getElementById("appArea")
        .style.display = "block";


      // DBからムーブ取得

      await loadMoves();

    }



    // ========================================
    // DBからムーブを取得
    // ========================================

    async function loadMoves() {

      const { data, error } =
        await supabaseClient
          .from("moves")
          .select("*")
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        alert(
          "ムーブの読み込みに失敗しました：" +
          error.message
        );

        return;
      }


      moves = data;

      showMoves();

    }



    // ========================================
    // ムーブを保存
    // ========================================

    async function saveMove() {

      const idea =
        document
          .getElementById("moveIdea")
          .value
          .trim();


      const detail =
        document
          .getElementById("moveDetail")
          .value
          .trim();


      // ネタが空の場合

      if (!idea) {

        alert(
          "ネタを入力してください"
        );

        return;
      }


      let error;


      // ======================================
      // 新規登録
      // ======================================

      if (editingId === null) {

        const result =
          await supabaseClient
            .from("moves")
            .insert({

              user_id:
                currentUser.id,

              idea:
                idea,

              detail:
                detail

            });


        error =
          result.error;

      }


      // ======================================
      // 編集
      // ======================================

      else {

        const result =
          await supabaseClient
            .from("moves")
            .update({

              idea:
                idea,

              detail:
                detail

            })
            .eq(
              "id",
              editingId
            );


        error =
          result.error;

      }


      // ======================================
      // エラー
      // ======================================

      if (error) {

        console.error(error);

        alert(
          "保存に失敗しました：" +
          error.message
        );

        return;
      }


      // 入力欄をリセット

      clearForm();


      // 一覧を再取得

      await loadMoves();

    }



    // ========================================
    // 編集
    // ========================================

    function editMove(id) {

      const move =
        moves.find(
          move =>
            move.id === id
        );


      if (!move) {

        return;

      }


      // 入力欄に戻す

      document
        .getElementById("moveIdea")
        .value =
          move.idea;


      document
        .getElementById("moveDetail")
        .value =
          move.detail || "";


      // 編集中のIDを保存

      editingId =
        move.id;


      // キャンセルボタン表示

      document
        .getElementById(
          "cancelEditButton"
        )
        .style.display =
          "inline-block";


      // 上までスクロール

      window.scrollTo({

        top: 0,

        behavior:
          "smooth"

      });

    }



    // ========================================
    // 入力欄リセット
    // ========================================

    function clearForm() {

      document
        .getElementById("moveIdea")
        .value =
          "";


      document
        .getElementById("moveDetail")
        .value =
          "";


      editingId =
        null;


      document
        .getElementById(
          "cancelEditButton"
        )
        .style.display =
          "none";

    }



    // ========================================
    // 削除
    // ========================================

    async function deleteMove(id) {

      const ok =
        confirm(
          "このムーブを削除しますか？"
        );


      if (!ok) {

        return;

      }


      const { error } =
        await supabaseClient
          .from("moves")
          .delete()
          .eq(
            "id",
            id
          );


      if (error) {

        alert(
          "削除に失敗しました：" +
          error.message
        );

        return;
      }


      // 編集中のムーブを削除した場合

      if (editingId === id) {

        clearForm();

      }


      // 一覧更新

      await loadMoves();

    }



    // ========================================
    // ムーブ一覧を表示
    // ========================================

    function showMoves() {

      const moveList =
        document
          .getElementById(
            "moveList"
          );


      moveList.innerHTML =
        "";


      // まだムーブがない場合

      if (moves.length === 0) {

        moveList.innerHTML =
          "<p>まだムーブがありません。</p>";

        return;

      }


      // ムーブを順番に表示

      moves.forEach(
        (move, index) => {


          // 詳細の改行を
          // <br>に変換

          const detailHtml =
            escapeHtml(
              move.detail || ""
            )
            .replace(
              /\n/g,
              "<br>"
            );


          moveList.innerHTML += `

            <div class="move">

              <h3>ムーブ${index + 1}</h3>

              <p>
                <strong class="move-label">ネタ：</strong>
                ${escapeHtml(move.idea)}
              </p>

              <p>
                <strong class="move-label">詳細：</strong>
                ${detailHtml}
              </p>

              <button onclick="editMove(${move.id})">
                編集
              </button>

              <button onclick="deleteMove(${move.id})">
                削除
              </button>

            </div>

          `;

        }
      );

    }



    // ========================================
    // HTMLとして解釈されないようにする
    // ========================================

    function escapeHtml(text) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    // ========================================
    // 起動
    // ========================================

    initialize();

  </script>

</body>

</html>
