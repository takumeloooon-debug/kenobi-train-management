<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ムーブ管理</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      margin-top: 8px;
      padding: 10px;
      box-sizing: border-box;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      margin-right: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .move {
      border-top: 1px solid #ccc;
      padding: 20px 0;
    }

    .move p {
      margin-top: 12px;
      margin-bottom: 12px;
    }

    .move-label {
      display: block;
      margin-bottom: 4px;
    }

    #appArea {
      display: none;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
    }

  </style>

</head>


<body>

  <!-- =========================
       管理画面に戻る
  ========================== -->

  <a href="index.html" class="back-link">
    ← 管理画面に戻る
  </a>


  <!-- =========================
       ムーブ管理画面
  ========================== -->

  <div id="appArea">

    <h1>ムーブ管理</h1>


    <!-- ネタ -->

    <h3>ネタ</h3>

    <input
      type="text"
      id="moveIdea"
      placeholder="ムーブのネタを入力"
    >


    <!-- 詳細 -->

    <h3>詳細</h3>

    <textarea
      id="moveDetail"
      placeholder="ムーブの詳細を入力"
    ></textarea>


    <br>


    <!-- 保存 -->

    <button onclick="saveMove()">
      保存
    </button>


    <!-- 編集キャンセル -->

    <button
      id="cancelEditButton"
      onclick="clearForm()"
      style="display:none;"
    >
      編集をキャンセル
    </button>


    <!-- ムーブ一覧 -->

    <h2>ムーブ一覧</h2>

    <div id="moveList"></div>

  </div>


  <script>

    // ========================================
    // Supabase接続設定
    // ========================================

    const SUPABASE_URL =
      "https://ujjnommuwuziebqlpoow.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_NkUf6eUb459UuuGDCMzJrQ_ILcc7PJf";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ========================================
    // 変数
    // ========================================

    let currentUser = null;

    let moves = [];

    let editingId = null;



    // ========================================
    // ページを開いたとき
    // ========================================

    async function initialize() {

      const { data, error } =
        await supabaseClient.auth.getSession();


      if (error) {

        console.error(error);

        return;
      }


      // ログインしていなければ
      // 管理画面へ戻す

      if (!data.session) {

        window.location.href =
          "index.html";

        return;
      }


      // ログインユーザーを保存

      currentUser =
        data.session.user;


      // 画面を表示

      document
        .getElementById("appArea")
        .style.display = "block";


      // DBからムーブ取得

      await loadMoves();

    }



    // ========================================
    // DBからムーブを取得
    // ========================================

    async function loadMoves() {

      const { data, error } =
        await supabaseClient
          .from("moves")
          .select("*")
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        alert(
          "ムーブの読み込みに失敗しました：" +
          error.message
        );

        return;
      }


      moves = data;

      showMoves();

    }



    // ========================================
    // ムーブを保存
    // ========================================

    async function saveMove() {

      const idea =
        document
          .getElementById("moveIdea")
          .value
          .trim();


      const detail =
        document
          .getElementById("moveDetail")
          .value
          .trim();


      // ネタが空の場合

      if (!idea) {

        alert(
          "ネタを入力してください"
        );

        return;
      }


      let error;


      // ======================================
      // 新規登録
      // ======================================

      if (editingId === null) {

        const result =
          await supabaseClient
            .from("moves")
            .insert({

              user_id:
                currentUser.id,

              idea:
                idea,

              detail:
                detail

            });


        error =
          result.error;

      }


      // ======================================
      // 編集
      // ======================================

      else {

        const result =
          await supabaseClient
            .from("moves")
            .update({

              idea:
                idea,

              detail:
                detail

            })
            .eq(
              "id",
              editingId
            );


        error =
          result.error;

      }


      // ======================================
      // エラー
      // ======================================

      if (error) {

        console.error(error);

        alert(
          "保存に失敗しました：" +
          error.message
        );

        return;
      }


      // 入力欄をリセット

      clearForm();


      // 一覧を再取得

      await loadMoves();

    }



    // ========================================
    // 編集
    // ========================================

    function editMove(id) {

      const move =
        moves.find(
          move =>
            move.id === id
        );


      if (!move) {

        return;

      }


      // 入力欄に戻す

      document
        .getElementById("moveIdea")
        .value =
          move.idea;


      document
        .getElementById("moveDetail")
        .value =
          move.detail || "";


      // 編集中のIDを保存

      editingId =
        move.id;


      // キャンセルボタン表示

      document
        .getElementById(
          "cancelEditButton"
        )
        .style.display =
          "inline-block";


      // 上までスクロール

      window.scrollTo({

        top: 0,

        behavior:
          "smooth"

      });

    }



    // ========================================
    // 入力欄リセット
    // ========================================

    function clearForm() {

      document
        .getElementById("moveIdea")
        .value =
          "";


      document
        .getElementById("moveDetail")
        .value =
          "";


      editingId =
        null;


      document
        .getElementById(
          "cancelEditButton"
        )
        .style.display =
          "none";

    }



    // ========================================
    // 削除
    // ========================================

    async function deleteMove(id) {

      const ok =
        confirm(
          "このムーブを削除しますか？"
        );


      if (!ok) {

        return;

      }


      const { error } =
        await supabaseClient
          .from("moves")
          .delete()
          .eq(
            "id",
            id
          );


      if (error) {

        alert(
          "削除に失敗しました：" +
          error.message
        );

        return;
      }


      // 編集中のムーブを削除した場合

      if (editingId === id) {

        clearForm();

      }


      // 一覧更新

      await loadMoves();

    }



    // ========================================
    // ムーブ一覧を表示
    // ========================================

    function showMoves() {

      const moveList =
        document
          .getElementById(
            "moveList"
          );


      moveList.innerHTML =
        "";


      // まだムーブがない場合

      if (moves.length === 0) {

        moveList.innerHTML =
          "<p>まだムーブがありません。</p>";

        return;

      }


      // ムーブを順番に表示

      moves.forEach(
        (move, index) => {


          // 詳細の改行を
          // <br>に変換

          const detailHtml =
            escapeHtml(
              move.detail || ""
            )
            .replace(
              /\n/g,
              "<br>"
            );


          moveList.innerHTML += `

            <div class="move">

              <h3>ムーブ${index + 1}</h3>

              <p>
                <strong class="move-label">ネタ：</strong>
                ${escapeHtml(move.idea)}
              </p>

              <p>
                <strong class="move-label">詳細：</strong>
                ${detailHtml}
              </p>

              <button onclick="editMove(${move.id})">
                編集
              </button>

              <button onclick="deleteMove(${move.id})">
                削除
              </button>

            </div>

          `;

        }
      );

    }



    // ========================================
    // HTMLとして解釈されないようにする
    // ========================================

    function escapeHtml(text) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    // ========================================
    // 起動
    // ========================================

    initialize();

  </script>

</body>

</html>
