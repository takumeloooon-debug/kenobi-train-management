<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダンス練習管理</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      margin-top: 8px;
      box-sizing: border-box;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      margin-right: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .diary,
    .move {
      border-top: 1px solid #ccc;
      padding: 20px 0;
    }

    .diary-text,
    .move-detail {
      white-space: pre-wrap;
    }

    .section {
      margin-bottom: 60px;
    }

    h2 {
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <h1>ダンス練習管理</h1>


  <!-- =========================
       日記
  ========================== -->

  <div class="section">

    <h2>練習日記</h2>

    <input type="date" id="date">

    <br><br>

    <textarea
      id="diaryText"
      placeholder="今日の練習について書く"
    ></textarea>

    <br>

    <button onclick="saveDiary()">保存</button>

    <h2>過去の日記</h2>

    <div id="diaryList"></div>

  </div>


  <!-- =========================
       ムーブ管理
  ========================== -->

  <div class="section">

    <h2>ムーブ管理</h2>

    <h3>ネタ</h3>

    <input
      type="text"
      id="moveIdea"
      placeholder="ムーブのネタを入力"
    >

    <h3>詳細</h3>

    <textarea
      id="moveDetail"
      placeholder="ムーブの詳細を入力"
    ></textarea>

    <br>

    <button onclick="saveMove()">保存</button>

    <h2>ムーブ一覧</h2>

    <div id="moveList"></div>

  </div>


  <script>

    // =========================
    // 日記
    // =========================

    let diaries =
      JSON.parse(localStorage.getItem("diaries")) || [];

    let editingDiaryIndex = null;


    function saveDiary() {

      const date =
        document.getElementById("date").value;

      const text =
        document.getElementById("diaryText").value;

      if (!date || !text.trim()) {
        alert("日付と日記を入力してください");
        return;
      }

      if (editingDiaryIndex === null) {

        diaries.unshift({
          date: date,
          text: text
        });

      } else {

        diaries[editingDiaryIndex] = {
          date: date,
          text: text
        };

        editingDiaryIndex = null;
      }

      localStorage.setItem(
        "diaries",
        JSON.stringify(diaries)
      );

      document.getElementById("date").value = "";
      document.getElementById("diaryText").value = "";

      showDiaries();
    }


    function editDiary(index) {

      const diary = diaries[index];

      document.getElementById("date").value = diary.date;
      document.getElementById("diaryText").value = diary.text;

      editingDiaryIndex = index;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    function deleteDiary(index) {

      const ok =
        confirm("この日記を削除しますか？");

      if (!ok) return;

      diaries.splice(index, 1);

      localStorage.setItem(
        "diaries",
        JSON.stringify(diaries)
      );

      showDiaries();
    }


    function showDiaries() {

      const diaryList =
        document.getElementById("diaryList");

      diaryList.innerHTML = "";

      diaries.forEach((diary, index) => {

        diaryList.innerHTML += `
          <div class="diary">

            <strong>${diary.date}</strong>

            <p class="diary-text">
              ${escapeHtml(diary.text)}
            </p>

            <button onclick="editDiary(${index})">
              編集
            </button>

            <button onclick="deleteDiary(${index})">
              削除
            </button>

          </div>
        `;
      });
    }



    // =========================
    // ムーブ管理
    // =========================

    let moves =
      JSON.parse(localStorage.getItem("moves")) || [];

    let editingMoveIndex = null;


    function saveMove() {

      const idea =
        document.getElementById("moveIdea").value;

      const detail =
        document.getElementById("moveDetail").value;

      if (!idea.trim()) {
        alert("ネタを入力してください");
        return;
      }


      if (editingMoveIndex === null) {

        // 新しいムーブを追加

        moves.push({
          idea: idea,
          detail: detail
        });

      } else {

        // 既存のムーブを編集

        moves[editingMoveIndex] = {
          idea: idea,
          detail: detail
        };

        editingMoveIndex = null;
      }


      saveMoves();


      document.getElementById("moveIdea").value = "";
      document.getElementById("moveDetail").value = "";

      showMoves();
    }


    function editMove(index) {

      const move = moves[index];

      document.getElementById("moveIdea").value =
        move.idea;

      document.getElementById("moveDetail").value =
        move.detail;

      editingMoveIndex = index;


      document
        .getElementById("moveIdea")
        .scrollIntoView({
          behavior: "smooth"
        });
    }


    function deleteMove(index) {

      const ok =
        confirm("このムーブを削除しますか？");

      if (!ok) return;

      moves.splice(index, 1);

      saveMoves();

      showMoves();
    }


    function saveMoves() {

      localStorage.setItem(
        "moves",
        JSON.stringify(moves)
      );
    }


    function showMoves() {

      const moveList =
        document.getElementById("moveList");

      moveList.innerHTML = "";


      moves.forEach((move, index) => {

        moveList.innerHTML += `
          <div class="move">

            <h3>
              ムーブ${index + 1}
            </h3>

            <p>
              <strong>ネタ：</strong><br>
              ${escapeHtml(move.idea)}
            </p>

            <p class="move-detail">
              <strong>詳細：</strong><br>
              ${escapeHtml(move.detail)}
            </p>

            <button onclick="editMove(${index})">
              編集
            </button>

            <button onclick="deleteMove(${index})">
              削除
            </button>

          </div>
        `;
      });
    }



    // =========================
    // 共通
    // =========================

    function escapeHtml(text) {

      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // ページを開いたときに表示

    showDiaries();
    showMoves();

  </script>

</body>
</html>
