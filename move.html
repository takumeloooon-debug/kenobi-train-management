<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ムーブ管理</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      margin-top: 8px;
      padding: 10px;
      box-sizing: border-box;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      margin-right: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .move {
      border-top: 1px solid #ccc;
      padding: 20px 0;
    }

    #appArea {
      display: none;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
    }
  </style>
</head>


<body>

  <a href="index.html" class="back-link">
    ← 管理画面に戻る
  </a>


  <div id="appArea">

    <h1>ムーブ管理</h1>


    <h3>ネタ</h3>

    <input
      type="text"
      id="moveIdea"
      placeholder="ムーブのネタを入力"
    >


    <h3>詳細</h3>

    <textarea
      id="moveDetail"
      placeholder="ムーブの詳細を入力"
    ></textarea>


    <br>


    <button onclick="saveMove()">
      保存
    </button>


    <button
      id="cancelEditButton"
      onclick="clearForm()"
      style="display:none;"
    >
      編集をキャンセル
    </button>


    <h2>ムーブ一覧</h2>

    <div id="moveList"></div>

  </div>


  <script>

    // =========================
    // Supabase
    // =========================

    const SUPABASE_URL =
      "https://ujjnommuwuziebqlpoow.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_NkUf6eUb459UuuGDCMzJrQ_ILcc7PJf";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let currentUser = null;

    let moves = [];

    let editingId = null;



    // =========================
    // 初期処理
    // =========================

    async function initialize() {

      const { data, error } =
        await supabaseClient.auth.getSession();


      if (error) {
        console.error(error);
        return;
      }


      // 未ログインならトップへ戻す
      if (!data.session) {

        window.location.href =
          "index.html";

        return;
      }


      currentUser =
        data.session.user;


      document
        .getElementById("appArea")
        .style.display = "block";


      await loadMoves();
    }



    // =========================
    // ムーブ取得
    // =========================

    async function loadMoves() {

      const { data, error } =
        await supabaseClient
          .from("moves")
          .select("*")
          .order("created_at", {
            ascending: true
          });


      if (error) {

        alert(
          "ムーブの読み込みに失敗しました：" +
          error.message
        );

        return;
      }


      moves = data;

      showMoves();
    }



    // =========================
    // 保存・更新
    // =========================

    async function saveMove() {

      const idea =
        document
          .getElementById("moveIdea")
          .value
          .trim();


      const detail =
        document
          .getElementById("moveDetail")
          .value
          .trim();


      if (!idea) {

        alert("ネタを入力してください");

        return;
      }


      let error;


      // 新規保存
      if (editingId === null) {

        const result =
          await supabaseClient
            .from("moves")
            .insert({
              user_id: currentUser.id,
              idea: idea,
              detail: detail
            });

        error = result.error;

      }


      // 編集保存
      else {

        const result =
          await supabaseClient
            .from("moves")
            .update({
              idea: idea,
              detail: detail
            })
            .eq("id", editingId);

        error = result.error;

      }


      if (error) {

        alert(
          "保存に失敗しました：" +
          error.message
        );

        return;
      }


      clearForm();

      await loadMoves();
    }



    // =========================
    // 編集
    // =========================

    function editMove(id) {

      const move =
        moves.find(
          move => move.id === id
        );


      if (!move) {
        return;
      }


      document
        .getElementById("moveIdea")
        .value = move.idea;


      document
        .getElementById("moveDetail")
        .value = move.detail || "";


      editingId = move.id;


      document
        .getElementById("cancelEditButton")
        .style.display = "inline-block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }



    // =========================
    // 入力欄リセット
    // =========================

    function clearForm() {

      document
        .getElementById("moveIdea")
        .value = "";


      document
        .getElementById("moveDetail")
        .value = "";


      editingId = null;


      document
        .getElementById("cancelEditButton")
        .style.display = "none";
    }



    // =========================
    // 削除
    // =========================

    async function deleteMove(id) {

      const ok =
        confirm(
          "このムーブを削除しますか？"
        );


      if (!ok) {
        return;
      }


      const { error } =
        await supabaseClient
          .from("moves")
          .delete()
          .eq("id", id);


      if (error) {

        alert(
          "削除に失敗しました：" +
          error.message
        );

        return;
      }


      if (editingId === id) {
        clearForm();
      }


      await loadMoves();
    }



    // =========================
    // 表示
    // =========================

    function showMoves() {

      const moveList =
        document.getElementById("moveList");


      moveList.innerHTML = "";


      if (moves.length === 0) {

        moveList.innerHTML =
          "<p>まだムーブがありません。</p>";

        return;
      }


moves.forEach((move, index) => {

  moveList.innerHTML += `
    <div class="move">

      <h3>ムーブ${index + 1}</h3>

      <p>
        <strong>ネタ：</strong><br>
        ${escapeHtml(move.idea)}
      </p>

      <p>
        <strong>詳細：</strong><br>
        ${escapeHtml(move.detail || "").replace(/\n/g, "<br>")}
      </p>

      <button onclick="editMove(${move.id})">
        編集
      </button>

      <button onclick="deleteMove(${move.id})">
        削除
      </button>

    </div>
  `;

});
    }



    // =========================
    // HTML対策
    // =========================

    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }



    initialize();

  </script>

</body>

</html>
