<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダンス管理</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      cursor: pointer;
    }

    #menuArea {
      display: none;
    }

    .menu-button {
      display: block;
      text-decoration: none;
      text-align: center;
      border: 1px solid #ccc;
      padding: 16px;
      margin-top: 16px;
      color: black;
    }
  </style>
</head>

<body>

  <h1>ダンス管理</h1>

  <!-- ログイン画面 -->
  <div id="loginArea">

    <h2>ログイン</h2>

    <input
      type="email"
      id="email"
      placeholder="メールアドレス"
    >

    <input
      type="password"
      id="password"
      placeholder="パスワード"
    >

    <button onclick="signUp()">
      新規登録
    </button>

    <button onclick="signIn()">
      ログイン
    </button>

  </div>


<div id="menuArea">

  <h2>管理画面</h2>

　<button onclick="location.href='./vision.html'">
  　なりたい像
　</button>
  
  <button onclick="location.href='./diary.html'">
    日記
  </button>

  <button onclick="location.href='./move.html'">
    ムーブ管理
  </button>

  <button onclick="signOut()">
    ログアウト
  </button>

</div>


  <script>

    const SUPABASE_URL =
      "https://ujjnommuwuziebqlpoow.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_NkUf6eUb459UuuGDCMzJrQ_ILcc7PJf";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function signUp() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const { error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

      if (error) {
        alert(error.message);
        return;
      }

      alert("登録しました");
    }


    async function signIn() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        alert(error.message);
        return;
      }

      showMenu();
    }


    async function signOut() {

      await supabaseClient.auth.signOut();

      document.getElementById("menuArea").style.display =
        "none";

      document.getElementById("loginArea").style.display =
        "block";
    }


    function showMenu() {

      document.getElementById("loginArea").style.display =
        "none";

      document.getElementById("menuArea").style.display =
        "block";
    }


    async function initialize() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data.session) {
        showMenu();
      }

    }


    initialize();

  </script>

</body>

</html>
