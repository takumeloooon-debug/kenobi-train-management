<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダンス管理</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
  box-sizing: border-box;
}
/* 背景 */
body {
  font-family: Arial, Helvetica, sans-serif;
  max-width: 600px;
  margin: 40px auto;
  padding: 0 20px;

  background: #eeeeff;
  color: #292938;
}

/* タイトル */
h1 {
  margin: 0 0 45px;

  color: #7775a8;

  font-size: 64px;
  font-weight: 900;
  letter-spacing: -5px;
  line-height: 0.9;
}

/* 小見出し */
h2 {
  margin: 0 0 20px;

  color: #7775a8;

  font-size: 18px;
  font-weight: 900;

  border-bottom: 2px solid #c2c0e4;
  padding-bottom: 8px;
}

/* ログイン・管理画面 */
#loginArea,
#menuArea {
  border: 2px solid #c2c0e4;
  border-radius: 12px;

  padding: 24px;

  background: #f7f7ff;
}

#menuArea {
  display: none;
}

/* 入力欄 */
input {
  width: 100%;
  padding: 14px;
  margin-top: 10px;

  border: 2px solid #c2c0e4;
  border-radius: 7px;

  background: #ffffff;
  color: #292938;

  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #8d8bb9;
}

/* ボタン */
button {
  width: 100%;

  margin-top: 12px;
  padding: 14px;

  border: 2px solid #aaa8d2;
  border-radius: 7px;

  background: #eeeeff;
  color: #555477;

  font-size: 15px;
  font-weight: 900;

  cursor: pointer;

  transition: 0.15s;
}

button:hover {
  background: #dcdcf5;
  color: #37364f;

  transform: translateY(-2px);
}

button:active {
  transform: translateY(0);
}

/* 管理画面 */
#menuArea button {
  text-align: left;

  padding: 20px 18px;

  font-size: 17px;

  position: relative;
}

#menuArea button::after {
  content: "→";

  position: absolute;
  right: 18px;

  font-size: 20px;
}

#menuArea button:last-child {
  margin-top: 30px;
}

/* スマホ */
@media (max-width: 600px) {

  body {
    margin: 25px auto;
    padding: 0 16px;
  }

  h1 {
    font-size: 52px;
    letter-spacing: -4px;
    margin-bottom: 35px;
  }

  #loginArea,
  #menuArea {
    padding: 18px;
  }
}
    /* =========================
   管理画面の間隔調整
========================= */

/* 見出しと最初のボタンを近づける */
#menuArea h2 {
  margin-bottom: 8px;
}

/* 管理メニュー3つの間隔 */
#menuArea button {
  margin-top: 10px;
}


/* =========================
   ログアウト
========================= */

#menuArea button:last-child {
  width: auto;

  margin-top: 28px;
  padding: 9px 14px;

  border: 1px solid #c9c8df;

  color: #9998b5;
  background: transparent;

  font-size: 13px;
  font-weight: 600;
}

/* ログアウトには矢印を出さない */
#menuArea button:last-child::after {
  content: none;
}

/* ログアウトのhoverも控えめ */
#menuArea button:last-child:hover {
  background: #f3f3fb;
  color: #777691;
  transform: none;
}
  </style>
</head>

<body>

  <h1>ダンス管理</h1>

  <!-- ログイン画面 -->
  <div id="loginArea">

    <h2>ログイン</h2>

    <input
      type="email"
      id="email"
      placeholder="メールアドレス"
    >

    <input
      type="password"
      id="password"
      placeholder="パスワード"
    >

    <button onclick="signUp()">
      新規登録
    </button>

    <button onclick="signIn()">
      ログイン
    </button>

  </div>


<div id="menuArea">

  <h2>管理画面</h2>

　<button onclick="location.href='./vision.html'">
    なりたい像
　</button>
  
  <button onclick="location.href='./diary.html'">
    日記
  </button>

  <button onclick="location.href='./move.html'">
    ムーブ管理
  </button>

  <button onclick="signOut()">
    ログアウト
  </button>

</div>


  <script>

    const SUPABASE_URL =
      "https://ujjnommuwuziebqlpoow.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_NkUf6eUb459UuuGDCMzJrQ_ILcc7PJf";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function signUp() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const { error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

      if (error) {
        alert(error.message);
        return;
      }

      alert("登録しました");
    }


    async function signIn() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        alert(error.message);
        return;
      }

      showMenu();
    }


    async function signOut() {

      await supabaseClient.auth.signOut();

      document.getElementById("menuArea").style.display =
        "none";

      document.getElementById("loginArea").style.display =
        "block";
    }


    function showMenu() {

      document.getElementById("loginArea").style.display =
        "none";

      document.getElementById("menuArea").style.display =
        "block";
    }


    async function initialize() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data.session) {
        showMenu();
      }

    }


    initialize();

  </script>

</body>

</html>
