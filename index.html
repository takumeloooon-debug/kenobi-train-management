<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダンス管理</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================
   全体
========================= */

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;

  max-width: 600px;
  margin: 40px auto;
  padding: 0 20px;

  background: #eeeeff;
  color: #171717;
}


/* =========================
   メインタイトル
========================= */

h1 {
  margin: 0 0 45px;

  color: #ff3b12;

  font-size: 64px;
  font-weight: 900;

  letter-spacing: -5px;
  line-height: 0.9;

  text-transform: uppercase;
}


/* =========================
   小見出し
========================= */

h2 {
  margin: 0 0 20px;

  color: #ff3b12;

  font-size: 18px;
  font-weight: 900;

  text-transform: uppercase;

  border-bottom: 2px solid #ff3b12;

  padding-bottom: 8px;
}


/* =========================
   ログイン・管理画面
========================= */

#loginArea,
#menuArea {
  border: 2px solid #ff6b4a;
  border-radius: 12px;

  padding: 24px;

  background: rgba(255, 255, 255, 0.25);
}

#menuArea {
  display: none;
}


/* =========================
   入力フォーム
========================= */

input {
  width: 100%;

  padding: 14px;

  margin-top: 10px;

  border: 2px solid #ff6b4a;
  border-radius: 7px;

  background: #f8f8ff;

  color: #171717;

  font-size: 15px;

  outline: none;
}


/* 入力中 */

input:focus {
  border-color: #ff3b12;

  background: white;
}


/* placeholder */

input::placeholder {
  color: #999;
}


/* =========================
   ボタン
========================= */

button {
  width: 100%;

  margin-top: 12px;
  padding: 14px;

  border: 2px solid #ff3b12;
  border-radius: 7px;

  background: transparent;

  color: #ff3b12;

  font-size: 15px;
  font-weight: 900;

  cursor: pointer;

  transition: 0.15s;
}


/* マウスを乗せた時 */

button:hover {
  background: #ff3b12;

  color: white;

  transform: translateY(-2px);
}


/* 押した瞬間 */

button:active {
  transform: translateY(0);
}


/* =========================
   管理画面のボタン
========================= */

#menuArea button {
  text-align: left;

  padding: 20px 18px;

  font-size: 17px;

  position: relative;
}


/* 右側に矢印 */

#menuArea button::after {
  content: "→";

  position: absolute;

  right: 18px;

  font-size: 20px;
}


/* =========================
   ログアウトだけ少し離す
========================= */

#menuArea button:last-child {
  margin-top: 30px;
}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  body {
    margin: 25px auto;

    padding: 0 16px;
  }

  h1 {
    font-size: 52px;

    letter-spacing: -4px;

    margin-bottom: 35px;
  }

  #loginArea,
  #menuArea {
    padding: 18px;
  }

}
  </style>
</head>

<body>

  <h1>ダンス管理</h1>

  <!-- ログイン画面 -->
  <div id="loginArea">

    <h2>ログイン</h2>

    <input
      type="email"
      id="email"
      placeholder="メールアドレス"
    >

    <input
      type="password"
      id="password"
      placeholder="パスワード"
    >

    <button onclick="signUp()">
      新規登録
    </button>

    <button onclick="signIn()">
      ログイン
    </button>

  </div>


<div id="menuArea">

  <h2>管理画面</h2>

　<button onclick="location.href='./vision.html'">
    なりたい像
　</button>
  
  <button onclick="location.href='./diary.html'">
    日記
  </button>

  <button onclick="location.href='./move.html'">
    ムーブ管理
  </button>

  <button onclick="signOut()">
    ログアウト
  </button>

</div>


  <script>

    const SUPABASE_URL =
      "https://ujjnommuwuziebqlpoow.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_NkUf6eUb459UuuGDCMzJrQ_ILcc7PJf";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function signUp() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const { error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

      if (error) {
        alert(error.message);
        return;
      }

      alert("登録しました");
    }


    async function signIn() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        alert(error.message);
        return;
      }

      showMenu();
    }


    async function signOut() {

      await supabaseClient.auth.signOut();

      document.getElementById("menuArea").style.display =
        "none";

      document.getElementById("loginArea").style.display =
        "block";
    }


    function showMenu() {

      document.getElementById("loginArea").style.display =
        "none";

      document.getElementById("menuArea").style.display =
        "block";
    }


    async function initialize() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data.session) {
        showMenu();
      }

    }


    initialize();

  </script>

</body>

</html>
