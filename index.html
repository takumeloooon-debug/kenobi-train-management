<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダンス練習日記</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    input[type="email"],
    input[type="password"],
    input[type="date"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      margin-top: 8px;
    }

    textarea {
      width: 100%;
      height: 150px;
      margin-top: 10px;
      padding: 10px;
      box-sizing: border-box;
    }

    button {
      margin-top: 10px;
      margin-right: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .diary {
      border-top: 1px solid #ccc;
      padding: 20px 0;
    }

    .diary-text {
      white-space: pre-wrap;
    }

    #appArea {
      display: none;
    }

    #loginArea {
      margin-bottom: 40px;
    }
  </style>
</head>

<body>

  <h1>ダンス練習日記</h1>

  <!-- ログイン画面 -->
  <div id="loginArea">

    <h2>ログイン</h2>

    <input
      type="email"
      id="email"
      placeholder="メールアドレス"
    >

    <input
      type="password"
      id="password"
      placeholder="パスワード"
    >

    <button onclick="signUp()">
      新規登録
    </button>

    <button onclick="signIn()">
      ログイン
    </button>

  </div>


  <!-- 日記画面 -->
  <div id="appArea">

    <button onclick="signOut()">
      ログアウト
    </button>

    <hr>

    <input type="date" id="date">

    <br><br>

    <textarea
      id="diaryText"
      placeholder="今日の練習について書く"
    ></textarea>

    <br>

    <button onclick="saveDiary()">
      保存
    </button>

    <button
      id="cancelEditButton"
      onclick="cancelEdit()"
      style="display:none;"
    >
      編集をキャンセル
    </button>

    <h2>過去の日記</h2>

    <div id="diaryList"></div>

  </div>


  <script>

    // ========================================
    // Supabase接続設定
    // ========================================

    const SUPABASE_URL =
      "ここにProject URLを入れる";

    const SUPABASE_KEY =
      "ここにPublishable keyを入れる";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let currentUser = null;

    let diaries = [];

    let editingId = null;


    // ========================================
    // 認証
    // ========================================

    async function signUp() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;


      if (!email || !password) {
        alert("メールアドレスとパスワードを入力してください");
        return;
      }


      const { data, error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });


      if (error) {
        alert(error.message);
        return;
      }


      alert(
        "登録しました。確認メールが届いた場合は、メール内のリンクを開いてください。"
      );
    }



    async function signIn() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;


      if (!email || !password) {
        alert("メールアドレスとパスワードを入力してください");
        return;
      }


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {
        alert(error.message);
        return;
      }


      currentUser = data.user;

      showApp();

      loadDiaries();
    }



    async function signOut() {

      await supabaseClient.auth.signOut();

      currentUser = null;

      diaries = [];

      editingId = null;

      document.getElementById("appArea").style.display =
        "none";

      document.getElementById("loginArea").style.display =
        "block";
    }



    // ========================================
    // 日記取得
    // ========================================

    async function loadDiaries() {

      if (!currentUser) {
        return;
      }


      const { data, error } =
        await supabaseClient
          .from("diaries")
          .select("*")
          .order("diary_date", {
            ascending: false
          })
          .order("created_at", {
            ascending: false
          });


      if (error) {
        alert(
          "日記の読み込みに失敗しました：" +
          error.message
        );

        return;
      }


      diaries = data;

      showDiaries();
    }



    // ========================================
    // 日記保存・更新
    // ========================================

    async function saveDiary() {

      if (!currentUser) {
        alert("ログインしてください");
        return;
      }


      const date =
        document.getElementById("date").value;

      const text =
        document.getElementById("diaryText").value.trim();


      if (!date || !text) {

        alert(
          "日付と日記を入力してください"
        );

        return;
      }


      // 新規保存
      if (editingId === null) {

        const { error } =
          await supabaseClient
            .from("diaries")
            .insert({
              user_id: currentUser.id,
              diary_date: date,
              text: text
            });


        if (error) {

          alert(
            "保存に失敗しました：" +
            error.message
          );

          return;
        }

      }

      // 編集保存
      else {

        const { error } =
          await supabaseClient
            .from("diaries")
            .update({
              diary_date: date,
              text: text
            })
            .eq("id", editingId);


        if (error) {

          alert(
            "更新に失敗しました：" +
            error.message
          );

          return;
        }

      }


      clearForm();

      await loadDiaries();
    }



    // ========================================
    // 編集
    // ========================================

    function editDiary(id) {

      const diary =
        diaries.find(
          diary => diary.id === id
        );


      if (!diary) {
        return;
      }


      document.getElementById("date").value =
        diary.diary_date;

      document.getElementById("diaryText").value =
        diary.text;


      editingId = diary.id;


      document
        .getElementById("cancelEditButton")
        .style.display = "inline-block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }



    function cancelEdit() {

      clearForm();

    }



    function clearForm() {

      document.getElementById("date").value = "";

      document.getElementById("diaryText").value = "";

      editingId = null;

      document
        .getElementById("cancelEditButton")
        .style.display = "none";
    }



    // ========================================
    // 削除
    // ========================================

    async function deleteDiary(id) {

      const ok =
        confirm(
          "この日記を削除しますか？"
        );


      if (!ok) {
        return;
      }


      const { error } =
        await supabaseClient
          .from("diaries")
          .delete()
          .eq("id", id);


      if (error) {

        alert(
          "削除に失敗しました：" +
          error.message
        );

        return;
      }


      if (editingId === id) {
        clearForm();
      }


      await loadDiaries();
    }



    // ========================================
    // 表示
    // ========================================

    function showDiaries() {

      const diaryList =
        document.getElementById("diaryList");

      diaryList.innerHTML = "";


      if (diaries.length === 0) {

        diaryList.innerHTML =
          "<p>まだ日記がありません。</p>";

        return;
      }


      diaries.forEach(diary => {

        diaryList.innerHTML += `
          <div class="diary">

            <strong>
              ${escapeHtml(diary.diary_date)}
            </strong>

            <p class="diary-text">${escapeHtml(diary.text)}</p>

            <button onclick="editDiary(${diary.id})">
              編集
            </button>

            <button onclick="deleteDiary(${diary.id})">
              削除
            </button>

          </div>
        `;

      });
    }



    function showApp() {

      document.getElementById("loginArea").style.display =
        "none";

      document.getElementById("appArea").style.display =
        "block";

    }



    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }



    // ========================================
    // ページを開いたとき
    // すでにログイン済みならそのまま表示
    // ========================================

    async function initialize() {

      const { data, error } =
        await supabaseClient.auth.getSession();


      if (error) {
        console.error(error);
        return;
      }


      if (data.session) {

        currentUser =
          data.session.user;

        showApp();

        await loadDiaries();

      }

    }


    initialize();

  </script>

</body>

</html>
