<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>なりたい像</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
  }

  input[type="date"] {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
    margin-top: 8px;
  }

  textarea {
    width: 100%;
    height: 150px;
    margin-top: 10px;
    padding: 10px;
    box-sizing: border-box;
  }

  button {
    margin-top: 10px;
    margin-right: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }

  .diary {
    border-top: 1px solid #ccc;
    padding: 20px 0;
  }

  .diary-text {
    white-space: pre-wrap;
  }

  #appArea {
    display: none;
  }

  .top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }

  .back-link {
    display: inline-block;
    text-decoration: none;
    color: #333;
  }

  .page-links {
    display: flex;
    gap: 40px;
  }

  .page-links a {
    text-decoration: none;
    color: #333;
  }

  .page-links a:hover {
    text-decoration: underline;
  }

  .vision-display {
  white-space: pre-wrap !important;
  line-height: 1.8;
  overflow-wrap: break-word;
  }

  @media (max-width: 600px) {
    .top-nav {
      flex-direction: column;
      align-items: flex-start;
      gap: 15px;
    }

    .page-links {
      gap: 20px;
      flex-wrap: wrap;
    }
</style>
</head>

<body>

  <!-- 上部ナビ -->
  <div class="top-nav">

    <a class="back-link" href="index.html">
      ← 管理画面
    </a>

    <div class="page-links">

      <a href="vision.html">
        なりたい像
      </a>

      <a href="diary.html">
        日記
      </a>

      <a href="move.html">
        ムーブ管理
      </a>

    </div>

  </div>


  <!-- なりたい像のメイン部分 -->
  <div id="appArea">

    <h1>なりたい像</h1>

    <div id="displayArea">

      <div
        id="visionDisplay"
        class="vision-display"
      ></div>

      <button
        id="editButton"
        onclick="startEdit()"
        style="display:none;"
      >
        編集
      </button>

    </div>


    <div id="editArea">

      <textarea
        id="visionInput"
        placeholder="どんなダンサーになりたいか、自由に書いてください"
      ></textarea>

      <br>

      <button onclick="saveVision()">
        保存
      </button>

      <button
        id="cancelButton"
        onclick="cancelEdit()"
        style="display:none;"
      >
        キャンセル
      </button>

    </div>

  </div>
  
  <script>

    const SUPABASE_URL =
      "https://ujjnommuwuziebqlpoow.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_NkUf6eUb459UuuGDCMzJrQ_ILcc7PJf";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let currentUser = null;

    let currentVision = null;



    // =========================
    // 初期処理
    // =========================

    async function initialize() {

      const { data, error } =
        await supabaseClient.auth.getSession();


      if (error) {
        console.error(error);
        return;
      }


      if (!data.session) {
        window.location.href = "index.html";
        return;
      }


      currentUser =
        data.session.user;


      document
        .getElementById("appArea")
        .style.display = "block";


      await loadVision();
    }



    // =========================
    // なりたい像を取得
    // =========================

    async function loadVision() {

      const { data, error } =
        await supabaseClient
          .from("visions")
          .select("*")
          .eq("user_id", currentUser.id)
          .maybeSingle();


      if (error) {

        alert(
          "読み込みに失敗しました：" +
          error.message
        );

        return;
      }


      currentVision = data;


      // まだ保存されていない場合
      if (!currentVision) {

        document
          .getElementById("displayArea")
          .style.display = "none";


        document
          .getElementById("editArea")
          .style.display = "block";


        document
          .getElementById("cancelButton")
          .style.display = "none";


        return;
      }


      // 保存済みの場合
      showVision();
    }



    // =========================
    // 表示
    // =========================

    function showVision() {

      document
        .getElementById("visionDisplay")
        .textContent =
          currentVision.content;


      document
        .getElementById("displayArea")
        .style.display =
          "block";


      document
        .getElementById("editArea")
        .style.display =
          "none";


      document
        .getElementById("editButton")
        .style.display =
          "inline-block";
    }



    // =========================
    // 編集開始
    // =========================

    function startEdit() {

      document
        .getElementById("visionInput")
        .value =
          currentVision.content;


      document
        .getElementById("displayArea")
        .style.display =
          "none";


      document
        .getElementById("editArea")
        .style.display =
          "block";


      document
        .getElementById("cancelButton")
        .style.display =
          "inline-block";
    }



    // =========================
    // 保存
    // =========================

    async function saveVision() {

      const content =
        document
          .getElementById("visionInput")
          .value
          .trim();


      if (!content) {

        alert(
          "内容を入力してください"
        );

        return;
      }


      let error;


      // 初回保存
      if (!currentVision) {

        const result =
          await supabaseClient
            .from("visions")
            .insert({
              user_id:
                currentUser.id,

              content:
                content
            });


        error =
          result.error;

      }


      // 編集保存
      else {

        const result =
          await supabaseClient
            .from("visions")
            .update({
              content:
                content
            })
            .eq(
              "id",
              currentVision.id
            );


        error =
          result.error;

      }


      if (error) {

        alert(
          "保存に失敗しました：" +
          error.message
        );

        return;
      }


      await loadVision();
    }



    // =========================
    // 編集キャンセル
    // =========================

    function cancelEdit() {

      if (!currentVision) {
        return;
      }


      showVision();
    }



    initialize();

  </script>

</body>

</html>
