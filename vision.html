<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>なりたい像</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * {
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  max-width: 700px;
  margin: 40px auto;
  padding: 0 20px;

  background: #eeeeff;
  color: #292938;
}


/* =========================
   上部ナビ
========================= */

.top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 40px;

  font-size: 14px;
  font-weight: 700;
}

.back-link,
.page-links a {
  text-decoration: none;
  color: #7775a8;
}

.back-link:hover,
.page-links a:hover {
  color: #555477;
}

.page-links {
  display: flex;
  gap: 24px;
}


/* =========================
   メインタイトル
========================= */

h1 {
  margin: 0 0 35px;

  color: #7775a8;

  font-size: 52px;
  font-weight: 900;

  letter-spacing: -4px;
  line-height: 1;
}


/* =========================
   アプリ本体
========================= */

#appArea {
  display: none;
  width: 100%;
  min-width: 0;
}


/* =========================
   なりたい像 表示部分
========================= */

.vision-display {
  white-space: pre-wrap;

  padding: 20px;

  border: 2px solid #c2c0e4;
  border-radius: 10px;

  background: #f7f7ff;

  color: #292938;

  font-size: 16px;
  line-height: 1.8;

  overflow-wrap: break-word;
}


/* =========================
   入力欄
========================= */

textarea {
  display: block;

  width: 100%;
  max-width: 100%;
  min-width: 0;

  height: 180px;

  margin-top: 12px;
  padding: 14px;

  box-sizing: border-box;

  border: 2px solid #c2c0e4;
  border-radius: 7px;

  background: #ffffff;
  color: #292938;

  font-family: inherit;
  font-size: 16px;
  line-height: 1.6;

  resize: vertical;
  outline: none;
}

textarea:focus {
  border-color: #8d8bb9;
}


/* =========================
   ボタン
========================= */

button {
  margin-top: 12px;
  margin-right: 6px;

  padding: 11px 18px;

  border: 2px solid #aaa8d2;
  border-radius: 7px;

  background: #eeeeff;
  color: #555477;

  font-size: 14px;
  font-weight: 800;

  cursor: pointer;

  transition: 0.15s;
}

button:hover {
  background: #dcdcf5;
  color: #37364f;
}


/* =========================
   編集ボタン
========================= */

#editButton {
  margin-top: 16px;
}


/* =========================
   キャンセルボタン
========================= */

#cancelButton {
  color: #9998b5;
  border-color: #d2d1e5;
  background: transparent;
}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  body {
    margin: 25px auto;
    padding: 0 16px;
  }

  .top-nav {
    flex-direction: column;
    align-items: flex-start;

    gap: 14px;

    margin-bottom: 30px;
  }

  .page-links {
    width: 100%;

    gap: 18px;

    flex-wrap: wrap;
  }

  h1 {
    font-size: 42px;

    letter-spacing: -3px;

    margin-bottom: 28px;
  }

  textarea {
    width: 100%;
    max-width: 100%;
    min-width: 0;

    height: 170px;
  }

  .vision-display {
    width: 100%;

    padding: 16px;

    font-size: 16px;
    line-height: 1.8;
  }
}
</style>
</head>

<body>

  <!-- 上部ナビ -->
  <div class="top-nav">

    <a class="back-link" href="index.html">
      ← 管理画面
    </a>

    <div class="page-links">

      <a href="vision.html">
        なりたい像
      </a>

      <a href="diary.html">
        日記
      </a>

      <a href="move.html">
        ムーブ管理
      </a>

    </div>

  </div>


  <!-- なりたい像のメイン部分 -->
  <div id="appArea">

    <h1>なりたい像</h1>

    <div id="displayArea">

      <div
        id="visionDisplay"
        class="vision-display"
      ></div>

      <button
        id="editButton"
        onclick="startEdit()"
        style="display:none;"
      >
        編集
      </button>

    </div>


    <div id="editArea">

      <textarea
        id="visionInput"
        placeholder="どんなダンサーになりたいか、自由に書いてください"
      ></textarea>

      <br>

      <button onclick="saveVision()">
        保存
      </button>

      <button
        id="cancelButton"
        onclick="cancelEdit()"
        style="display:none;"
      >
        キャンセル
      </button>

    </div>

  </div>
  
  <script>

    const SUPABASE_URL =
      "https://ujjnommuwuziebqlpoow.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_NkUf6eUb459UuuGDCMzJrQ_ILcc7PJf";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let currentUser = null;

    let currentVision = null;



    // =========================
    // 初期処理
    // =========================

    async function initialize() {

      const { data, error } =
        await supabaseClient.auth.getSession();


      if (error) {
        console.error(error);
        return;
      }


      if (!data.session) {
        window.location.href = "index.html";
        return;
      }


      currentUser =
        data.session.user;


      document
        .getElementById("appArea")
        .style.display = "block";


      await loadVision();
    }



    // =========================
    // なりたい像を取得
    // =========================

    async function loadVision() {

      const { data, error } =
        await supabaseClient
          .from("visions")
          .select("*")
          .eq("user_id", currentUser.id)
          .maybeSingle();


      if (error) {

        alert(
          "読み込みに失敗しました：" +
          error.message
        );

        return;
      }


      currentVision = data;


      // まだ保存されていない場合
      if (!currentVision) {

        document
          .getElementById("displayArea")
          .style.display = "none";


        document
          .getElementById("editArea")
          .style.display = "block";


        document
          .getElementById("cancelButton")
          .style.display = "none";


        return;
      }


      // 保存済みの場合
      showVision();
    }



    // =========================
    // 表示
    // =========================

    function showVision() {

      document
        .getElementById("visionDisplay")
        .textContent =
          currentVision.content;


      document
        .getElementById("displayArea")
        .style.display =
          "block";


      document
        .getElementById("editArea")
        .style.display =
          "none";


      document
        .getElementById("editButton")
        .style.display =
          "inline-block";
    }



    // =========================
    // 編集開始
    // =========================

    function startEdit() {

      document
        .getElementById("visionInput")
        .value =
          currentVision.content;


      document
        .getElementById("displayArea")
        .style.display =
          "none";


      document
        .getElementById("editArea")
        .style.display =
          "block";


      document
        .getElementById("cancelButton")
        .style.display =
          "inline-block";
    }



    // =========================
    // 保存
    // =========================

    async function saveVision() {

      const content =
        document
          .getElementById("visionInput")
          .value
          .trim();


      if (!content) {

        alert(
          "内容を入力してください"
        );

        return;
      }


      let error;


      // 初回保存
      if (!currentVision) {

        const result =
          await supabaseClient
            .from("visions")
            .insert({
              user_id:
                currentUser.id,

              content:
                content
            });


        error =
          result.error;

      }


      // 編集保存
      else {

        const result =
          await supabaseClient
            .from("visions")
            .update({
              content:
                content
            })
            .eq(
              "id",
              currentVision.id
            );


        error =
          result.error;

      }


      if (error) {

        alert(
          "保存に失敗しました：" +
          error.message
        );

        return;
      }


      await loadVision();
    }



    // =========================
    // 編集キャンセル
    // =========================

    function cancelEdit() {

      if (!currentVision) {
        return;
      }


      showVision();
    }



    initialize();

  </script>

</body>

</html>
